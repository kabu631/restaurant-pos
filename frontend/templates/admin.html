<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Superadmin — Restaurant POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<nav class="bg-gray-900 text-white px-6 py-3 flex items-center justify-between shadow">
  <div class="flex items-center gap-3">
    <span class="text-xl">🍽️</span>
    <span class="font-bold text-lg">POS Platform Admin</span>
  </div>
  <div class="flex items-center gap-4">
    <span id="nav-user" class="text-sm text-gray-300"></span>
    <button onclick="logout()" class="text-sm bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded font-medium">Logout</button>
  </div>
</nav>

<div class="p-6 max-w-5xl mx-auto">

  <!-- Stats row -->
  <div class="grid grid-cols-3 gap-4 mb-6">
    <div class="bg-white rounded-xl shadow p-5 text-center">
      <p class="text-3xl font-bold text-blue-700" id="stat-total">—</p>
      <p class="text-sm text-gray-500 mt-1">Total Restaurants</p>
    </div>
    <div class="bg-white rounded-xl shadow p-5 text-center">
      <p class="text-3xl font-bold text-green-600" id="stat-active">—</p>
      <p class="text-sm text-gray-500 mt-1">Active</p>
    </div>
    <div class="bg-white rounded-xl shadow p-5 text-center">
      <p class="text-3xl font-bold text-red-500" id="stat-inactive">—</p>
      <p class="text-sm text-gray-500 mt-1">Inactive</p>
    </div>
  </div>

  <!-- Restaurant list -->
  <div class="bg-white rounded-xl shadow overflow-hidden">
    <div class="px-6 py-4 border-b flex items-center justify-between">
      <h2 class="font-semibold text-gray-700">All Restaurants</h2>
      <a href="/register"
        class="text-sm bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium">
        + Add Restaurant
      </a>
    </div>
    <table class="w-full text-sm">
      <thead>
        <tr class="bg-gray-50 border-b text-gray-500 text-left">
          <th class="px-6 py-3 font-medium">Restaurant</th>
          <th class="px-4 py-3 font-medium">Code</th>
          <th class="px-4 py-3 font-medium">Phone</th>
          <th class="px-4 py-3 font-medium">Users</th>
          <th class="px-4 py-3 font-medium">Registered</th>
          <th class="px-4 py-3 font-medium">Status</th>
          <th class="px-4 py-3"></th>
        </tr>
      </thead>
      <tbody id="restaurant-tbody"></tbody>
    </table>
    <p id="empty-msg" class="hidden text-center text-gray-400 py-10">No restaurants registered yet.</p>
  </div>
</div>

<script>
  const token = localStorage.getItem('token');
  const user  = JSON.parse(localStorage.getItem('user') || '{}');

  if (!token || user.role !== 'superadmin') {
    window.location.href = '/login';
  }

  document.getElementById('nav-user').textContent = user.full_name || 'Superadmin';

  async function api(path, opts = {}) {
    return fetch(path, {
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) },
      ...opts,
    });
  }

  async function load() {
    const res = await api('/api/restaurants');
    if (!res.ok) { alert('Failed to load restaurants'); return; }
    const list = await res.json();

    document.getElementById('stat-total').textContent    = list.length;
    document.getElementById('stat-active').textContent   = list.filter(r => r.is_active).length;
    document.getElementById('stat-inactive').textContent = list.filter(r => !r.is_active).length;

    const tbody = document.getElementById('restaurant-tbody');
    if (!list.length) {
      document.getElementById('empty-msg').classList.remove('hidden');
      return;
    }

    tbody.innerHTML = list.map(r => `
      <tr class="border-b hover:bg-gray-50">
        <td class="px-6 py-3 font-medium text-gray-800">${r.name}</td>
        <td class="px-4 py-3 font-mono text-xs text-blue-600">${r.slug}</td>
        <td class="px-4 py-3 text-gray-500">${r.phone || '—'}</td>
        <td class="px-4 py-3 text-gray-600">${r.user_count}</td>
        <td class="px-4 py-3 text-xs text-gray-400">
          ${r.created_at ? new Date(r.created_at).toLocaleDateString() : '—'}
        </td>
        <td class="px-4 py-3">
          <span class="text-xs font-bold px-2 py-0.5 rounded-full ${r.is_active
            ? 'bg-green-100 text-green-700'
            : 'bg-red-100 text-red-600'}">
            ${r.is_active ? 'Active' : 'Inactive'}
          </span>
        </td>
        <td class="px-4 py-3 flex gap-2">
          <button onclick="toggle(${r.id}, ${r.is_active})"
            class="text-xs px-3 py-1 rounded border ${r.is_active
              ? 'border-red-300 text-red-600 hover:bg-red-50'
              : 'border-green-300 text-green-600 hover:bg-green-50'}">
            ${r.is_active ? 'Deactivate' : 'Activate'}
          </button>
          <a href="/login?restaurant=${r.slug}"
            class="text-xs px-3 py-1 rounded border border-blue-300 text-blue-600 hover:bg-blue-50">
            Login as →
          </a>
        </td>
      </tr>`).join('');
  }

  async function toggle(id, currentlyActive) {
    if (!confirm(currentlyActive
      ? 'Deactivate this restaurant? Their staff will not be able to log in.'
      : 'Activate this restaurant?')) return;
    const res = await api(`/api/restaurants/${id}/toggle`, { method: 'PATCH' });
    if (res.ok) load();
    else alert('Failed to update status');
  }

  function logout() {
    localStorage.clear();
    window.location.href = '/login';
  }

  load();
</script>
</body>
</html>
