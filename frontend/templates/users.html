<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff — Restaurant POS</title>
  <script src="/static/vendor/tailwindcss-3.4.17.js"></script>
  <script src="/static/js/pos.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<div id="pos-nav"></div>

<main class="p-3 sm:p-5 max-w-6xl mx-auto space-y-4">

  <div class="flex flex-wrap items-center gap-3">
    <div class="flex-1 min-w-[14rem]">
      <h1 class="text-xl font-extrabold text-gray-900">👥 Staff</h1>
      <p class="text-sm text-gray-500">Add your team, choose their role, and control when they can log in.
        <a href="/settings#roles" class="text-blue-700 font-medium hover:underline">Change what each role can do →</a></p>
    </div>
    <button onclick="openForm()" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold shadow-sm">+ Add staff</button>
  </div>

  <!-- Role summary -->
  <section id="roles" class="grid grid-cols-2 lg:grid-cols-4 gap-3"></section>

  <!-- Filter -->
  <div class="flex flex-wrap items-center gap-2">
    <div id="filters" class="flex gap-1 bg-white rounded-xl p-1 shadow-sm overflow-x-auto"></div>
    <input id="search" type="search" placeholder="Search name or username" class="border rounded-xl px-3 py-2 text-sm flex-1 min-w-[10rem] max-w-xs">
    <span id="online-now" class="text-sm text-gray-500"></span>
  </div>

  <section id="grid" class="grid gap-3" style="grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));"></section>
  <div id="empty" class="hidden text-center py-16 text-gray-500">No staff match this filter.</div>
</main>

<script>
const { api, esc, toast, fail } = POS;

// What each role is for — shown when picking a role
const ROLES = {
  admin:   { icon: '👑', label: 'Admin', color: 'blue',
             does: 'The boss. Can do everything: staff, menu, tables, stock, reports, settings, and approve discounts and voids.' },
  cashier: { icon: '💳', label: 'Cashier', color: 'green',
             does: 'Takes payment and prints the final bill. Runs the cash drawer. Can also ring up takeaway orders.' },
  waiter:  { icon: '🧑‍🍳', label: 'Waiter', color: 'amber',
             does: 'Opens tables, takes orders and sends them to the kitchen, serves food, handles bookings.' },
  kitchen: { icon: '🔥', label: 'Kitchen', color: 'rose',
             does: 'Sees new orders on the kitchen screen, accepts them, marks food ready, and marks dishes sold out.' },
};
const BADGE = {
  blue: 'bg-blue-100 text-blue-800', green: 'bg-green-100 text-green-800',
  amber: 'bg-amber-100 text-amber-800', rose: 'bg-rose-100 text-rose-800',
};
const AVATAR = { blue: 'bg-blue-600', green: 'bg-green-600', amber: 'bg-amber-500', rose: 'bg-rose-600' };
const PERM_LABELS = {};     // key → label, from /api/permissions

let USERS = [];
let filter = 'all';

async function init() {
  if (!POS.requireLogin() || !POS.isAdmin()) { location.href = POS.user().home || '/login'; return; }
  POS.nav('/users');
  document.getElementById('search').oninput = POS.debounce(render, 150);
  try {
    const cat = await api('/api/permissions');
    cat.permissions.forEach(p => PERM_LABELS[p.key] = p.label);
  } catch { /* labels are optional */ }
  await load();
  setInterval(() => { if (!document.hidden) load(); }, 30000);
}

async function load() {
  try { USERS = await api('/api/users'); } catch (e) { fail(e); return; }
  render();
}

function ago(iso) {
  if (!iso) return 'never';
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins} min ago`;
  if (mins < 24 * 60) return `${Math.floor(mins / 60)} h ago`;
  if (mins < 7 * 24 * 60) return `${Math.floor(mins / 1440)} day(s) ago`;
  return POS.date(iso);
}

function render() {
  const active = USERS.filter(u => u.is_active);
  // Role summary cards
  document.getElementById('roles').innerHTML = Object.entries(ROLES).map(([k, r]) => {
    const people = active.filter(u => u.role === k);
    const online = people.filter(u => u.online).length;
    return `<button onclick="setFilter('${k}')" class="text-left bg-white rounded-2xl shadow-sm p-4 border-2 ${filter === k ? 'border-blue-500' : 'border-transparent'} hover:shadow-md transition">
      <div class="flex items-center justify-between">
        <span class="text-2xl">${r.icon}</span>
        ${online ? `<span class="text-xs font-semibold text-green-700 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-500"></span>${online} online</span>` : ''}
      </div>
      <p class="mt-1 font-bold text-gray-900">${people.length} ${r.label}${people.length === 1 ? '' : 's'}</p>
      <p class="text-xs text-gray-500 line-clamp-2">${esc(r.does)}</p>
    </button>`;
  }).join('');

  const counts = { all: active.length, inactive: USERS.length - active.length };
  document.getElementById('filters').innerHTML = [['all', `All (${counts.all})`], ...Object.entries(ROLES).map(([k, r]) => [k, r.label]), ['inactive', `Inactive (${counts.inactive})`]]
    .map(([k, label]) => `<button onclick="setFilter('${k}')" class="px-3 py-1.5 rounded-lg text-sm font-semibold whitespace-nowrap ${filter === k ? 'bg-blue-600 text-white' : 'text-gray-600 hover:bg-gray-100'}">${esc(label)}</button>`).join('');

  const onlineNow = active.filter(u => u.online).length;
  document.getElementById('online-now').innerHTML = onlineNow
    ? `<span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>${onlineNow} online now</span>` : '';

  const q = document.getElementById('search').value.trim().toLowerCase();
  const shown = USERS.filter(u =>
    (filter === 'all' ? u.is_active : filter === 'inactive' ? !u.is_active : (u.is_active && u.role === filter)) &&
    (!q || u.full_name.toLowerCase().includes(q) || u.username.toLowerCase().includes(q)));
  document.getElementById('empty').classList.toggle('hidden', shown.length > 0);
  document.getElementById('grid').innerHTML = shown.map(card).join('');
}

function setFilter(f) { filter = filter === f && f !== 'all' ? 'all' : f; render(); }

function card(u) {
  const r = ROLES[u.role] || { icon: '👤', label: u.role, color: 'blue' };
  const me = u.id === POS.user().id;
  const initials = u.full_name.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  const perms = (u.permissions || []);
  const permText = perms.includes('*') ? 'Everything'
    : perms.length ? perms.map(p => PERM_LABELS[p] || p).join(' · ') : 'Nothing yet — set it in Roles & permissions';
  const hours = u.shift_start ? `🕘 ${u.shift_start}–${u.shift_end}` : '🕘 Any time';
  return `
  <article class="bg-white rounded-2xl shadow-sm p-4 flex flex-col gap-3 ${u.is_active ? '' : 'opacity-60'}">
    <div class="flex items-start gap-3">
      <div class="relative shrink-0">
        <div class="w-12 h-12 rounded-full ${AVATAR[r.color]} text-white font-bold flex items-center justify-center">${esc(initials)}</div>
        ${u.online ? '<span class="absolute -bottom-0.5 -right-0.5 w-4 h-4 rounded-full bg-green-500 border-2 border-white" title="Online now"></span>' : ''}
      </div>
      <div class="min-w-0 flex-1">
        <p class="font-bold text-gray-900 truncate">${esc(u.full_name)}${me ? ' <span class="text-xs font-normal text-gray-500">(you)</span>' : ''}</p>
        <p class="text-xs text-gray-500">@${esc(u.username)}</p>
        <div class="flex flex-wrap gap-1 mt-1.5">
          <span class="text-[11px] font-bold rounded-full px-2 py-0.5 ${BADGE[r.color]}">${r.icon} ${esc(r.label)}</span>
          ${u.is_active ? '' : '<span class="text-[11px] font-bold rounded-full px-2 py-0.5 bg-gray-200 text-gray-700">Inactive</span>'}
          ${u.has_pin ? '<span class="text-[11px] rounded-full px-2 py-0.5 bg-gray-100 text-gray-600">🔢 PIN</span>' : '<span class="text-[11px] rounded-full px-2 py-0.5 bg-amber-50 text-amber-700">No PIN</span>'}
          <span class="text-[11px] rounded-full px-2 py-0.5 ${u.can_login_now ? 'bg-gray-100 text-gray-600' : 'bg-red-50 text-red-700'}" title="${u.can_login_now ? 'Can log in now' : 'Outside login hours right now'}">${hours}</span>
        </div>
      </div>
    </div>
    <p class="text-xs text-gray-600"><span class="font-semibold text-gray-500">Can:</span> ${esc(permText)}</p>
    <p class="text-xs text-gray-500">${u.online ? '<span class="text-green-700 font-semibold">● Online now</span>' : `Last active ${ago(u.last_seen_at || u.last_login)}`}</p>
    <div class="flex flex-wrap gap-1.5 mt-auto pt-2 border-t">
      <button onclick="openForm(${u.id})" class="px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm font-semibold">✏️ Edit</button>
      <button onclick="resetPin(${u.id})" class="px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm">🔢 PIN</button>
      <button onclick="resetPassword(${u.id})" class="px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm">🔒 Password</button>
      ${!me && u.is_active ? `<button onclick="signOut(${u.id})" class="px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm" title="Log them out on every device">🚪 Sign out</button>` : ''}
      ${me ? '' : u.is_active
        ? `<button onclick="setActive(${u.id}, false)" class="px-3 py-1.5 rounded-lg text-red-600 hover:bg-red-50 text-sm ml-auto">Deactivate</button>`
        : `<button onclick="setActive(${u.id}, true)" class="px-3 py-1.5 rounded-lg text-green-700 hover:bg-green-50 text-sm font-semibold ml-auto">Re-activate</button>`}
    </div>
  </article>`;
}

// ── Add / edit ───────────────────────────────────────────────────────────────
function openForm(id) {
  const u = id ? USERS.find(x => x.id === id) : null;
  const role = u ? u.role : 'waiter';
  POS.modal(`
    <form class="space-y-4">
      <h2 class="text-lg font-bold text-gray-900">${u ? 'Edit ' + esc(u.full_name) : 'Add staff member'}</h2>
      <div class="grid grid-cols-2 gap-3">
        <label class="col-span-2 text-sm font-medium text-gray-700">Full name
          <input name="full_name" required value="${esc(u ? u.full_name : '')}" class="mt-1 w-full border rounded-xl px-3 py-2.5" placeholder="Sita Sharma"></label>
        <label class="text-sm font-medium text-gray-700">Username
          <input name="username" required value="${esc(u ? u.username : '')}" autocomplete="off" class="mt-1 w-full border rounded-xl px-3 py-2.5" placeholder="sita"></label>
        <label class="text-sm font-medium text-gray-700">PIN ${u && u.has_pin ? '<span class="text-xs text-gray-400">(blank = keep)</span>' : ''}
          <input name="pin" inputmode="numeric" maxlength="4" autocomplete="off" class="mt-1 w-full border rounded-xl px-3 py-2.5 tracking-widest" placeholder="4 digits"></label>
        ${u ? '' : `<label class="col-span-2 text-sm font-medium text-gray-700">Password
          <input name="password" type="password" required minlength="6" autocomplete="new-password" class="mt-1 w-full border rounded-xl px-3 py-2.5" placeholder="At least 6 characters"></label>`}
      </div>
      <div>
        <p class="text-sm font-medium text-gray-700 mb-1.5">Role</p>
        <div class="grid gap-2">
          ${Object.entries(ROLES).map(([k, r]) => `
          <label class="flex gap-3 items-start border-2 rounded-xl p-3 cursor-pointer has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50">
            <input type="radio" name="role" value="${k}" class="mt-1 accent-blue-600" ${k === role ? 'checked' : ''}>
            <span><span class="font-semibold">${r.icon} ${r.label}</span><span class="block text-xs text-gray-600">${esc(r.does)}</span></span>
          </label>`).join('')}
        </div>
      </div>
      <div>
        <label class="flex items-center gap-2 text-sm font-medium text-gray-700">
          <input type="checkbox" name="limit_hours" class="w-4 h-4 accent-blue-600" ${u && u.shift_start ? 'checked' : ''}> Only allow login during these hours
        </label>
        <div data-hours class="flex items-center gap-2 mt-2 ${u && u.shift_start ? '' : 'hidden'}">
          <input name="shift_start" type="time" value="${esc(u && u.shift_start || '09:00')}" class="border rounded-xl px-3 py-2">
          <span class="text-gray-500">to</span>
          <input name="shift_end" type="time" value="${esc(u && u.shift_end || '17:00')}" class="border rounded-xl px-3 py-2">
        </div>
        <p class="text-xs text-gray-500 mt-1">Nepal time. Overnight shifts work too (e.g. 18:00 to 02:00). Admins can always log in.</p>
      </div>
      <p data-err class="hidden text-sm text-red-600"></p>
      <div class="flex gap-2">
        <button type="button" data-x class="flex-1 py-3 rounded-xl border font-medium">Cancel</button>
        <button class="flex-1 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold">${u ? 'Save' : 'Add staff'}</button>
      </div>
    </form>`, {
    wide: true,
    onMount: (w, close) => {
      const f = w.querySelector('form');
      const err = w.querySelector('[data-err]');
      w.querySelector('[data-x]').onclick = () => close(null);
      f.limit_hours.onchange = () => w.querySelector('[data-hours]').classList.toggle('hidden', !f.limit_hours.checked);
      f.pin.oninput = () => { f.pin.value = f.pin.value.replace(/\D/g, ''); };
      f.onsubmit = async e => {
        e.preventDefault();
        err.classList.add('hidden');
        const body = {
          full_name: f.full_name.value.trim(), username: f.username.value.trim(), role: f.role.value,
          shift_start: f.limit_hours.checked ? f.shift_start.value : '',
          shift_end: f.limit_hours.checked ? f.shift_end.value : '',
        };
        if (f.pin.value) body.pin = f.pin.value;
        if (!u) body.password = f.password.value;
        if (u && u.role !== body.role && !(await POS.confirm(
          `${u.full_name} will be logged out and sign in again as ${ROLES[body.role].label}.`, { title: 'Change role?' }))) return;
        try {
          if (u) await api(`/api/users/${u.id}`, { method: 'PUT', body });
          else await api('/api/users', { method: 'POST', body });
          toast(u ? 'Saved' : `${body.full_name} added — they can log in now`);
          close(true);
          load();
        } catch (e2) { err.textContent = e2.message; err.classList.remove('hidden'); }
      };
      setTimeout(() => f.full_name.focus(), 30);
    },
  });
}

async function resetPin(id) {
  const u = USERS.find(x => x.id === id);
  const pin = await POS.prompt(`New PIN for ${u.full_name}`, {
    message: '4 digits, used to log in quickly on shared tills. Each person needs a different PIN.',
    inputmode: 'numeric', placeholder: '••••', required: true, okText: 'Set PIN' });
  if (!pin) return;
  try {
    await api(`/api/users/${id}/reset-pin`, { method: 'PATCH', body: { new_pin: pin } });
    toast('PIN updated'); load();
  } catch (e) { fail(e); }
}

async function resetPassword(id) {
  const u = USERS.find(x => x.id === id);
  const pw = await POS.prompt(`New password for ${u.full_name}`, {
    message: u.id === POS.user().id ? 'At least 6 characters.' : 'At least 6 characters. They will be logged out on every device.',
    type: 'password', required: true, okText: 'Set password' });
  if (!pw) return;
  try {
    await api(`/api/users/${id}/reset-password`, { method: 'PATCH', body: { new_password: pw } });
    toast('Password updated'); load();
  } catch (e) { fail(e); }
}

async function signOut(id) {
  const u = USERS.find(x => x.id === id);
  if (!(await POS.confirm(`${u.full_name} will be logged out on every phone, tablet and PC right away. They can log in again.`,
    { title: 'Sign out everywhere?', okText: 'Sign out' }))) return;
  try {
    await api(`/api/users/${id}/sign-out`, { method: 'POST' });
    toast(`${u.full_name} signed out`); load();
  } catch (e) { fail(e); }
}

async function setActive(id, on) {
  const u = USERS.find(x => x.id === id);
  if (!on && !(await POS.confirm(`${u.full_name} won't be able to log in, and is signed out now. Their sales history stays.`,
    { title: 'Deactivate?', okText: 'Deactivate', danger: true }))) return;
  try {
    await api(`/api/users/${id}/${on ? 'activate' : 'deactivate'}`, { method: 'PATCH' });
    toast(on ? `${u.full_name} re-activated` : `${u.full_name} deactivated`); load();
  } catch (e) { fail(e); }
}

init();
</script>
</body>
</html>
