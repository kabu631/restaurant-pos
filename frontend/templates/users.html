<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Management — Restaurant POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .role-admin    { background:#dbeafe; color:#1d4ed8; }
    .role-cashier  { background:#d1fae5; color:#065f46; }
    .role-waiter   { background:#fef3c7; color:#92400e; }
    .role-kitchen  { background:#fce7f3; color:#9d174d; }
    .modal-overlay { background:rgba(0,0,0,.45); }
    @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
    .fade-in { animation:fadeIn .2s ease forwards; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

<!-- Nav -->
<nav class="bg-gray-900 text-white px-6 py-3 flex items-center justify-between shadow shrink-0">
  <div class="flex items-center gap-3">
    <a href="/dashboard" class="text-gray-400 hover:text-white text-xl">🍽️</a>
    <span class="text-gray-600">|</span>
    <span class="font-bold text-lg">Staff Management</span>
  </div>
  <div class="flex items-center gap-3">
    <span id="nav-user" class="text-sm text-gray-300 hidden sm:block"></span>
    <button onclick="logout()"
      class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-sm font-medium">
      Logout
    </button>
  </div>
</nav>

<main class="flex-1 p-6 max-w-6xl mx-auto w-full">

  <!-- Filter + Add row -->
  <div class="flex flex-wrap items-center gap-3 mb-5">
    <select id="filter-role" onchange="loadUsers()"
      class="border rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
      <option value="">All Roles</option>
      <option value="admin">Admin</option>
      <option value="cashier">Cashier</option>
      <option value="waiter">Waiter</option>
      <option value="kitchen">Kitchen</option>
    </select>
    <select id="filter-status" onchange="loadUsers()"
      class="border rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
      <option value="">All Status</option>
      <option value="true">Active</option>
      <option value="false">Inactive</option>
    </select>
    <input id="filter-search" type="text" placeholder="Search name or username…"
      oninput="renderTable()"
      class="border rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-400 flex-1 min-w-[160px]" />
    <button onclick="openAddModal()"
      class="ml-auto bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm">
      + Add Staff
    </button>
  </div>

  <!-- Table card -->
  <div class="bg-white rounded-xl shadow overflow-hidden">
    <table class="w-full text-sm">
      <thead>
        <tr class="bg-gray-50 border-b text-gray-500 text-left text-xs uppercase tracking-wide">
          <th class="px-5 py-3 font-semibold">Name</th>
          <th class="px-4 py-3 font-semibold">Username</th>
          <th class="px-4 py-3 font-semibold">Role</th>
          <th class="px-4 py-3 font-semibold">PIN</th>
          <th class="px-4 py-3 font-semibold">Status</th>
          <th class="px-4 py-3 font-semibold">Last Login</th>
          <th class="px-4 py-3 font-semibold">Actions</th>
        </tr>
      </thead>
      <tbody id="users-tbody"></tbody>
    </table>
    <p id="empty-msg" class="hidden text-center text-gray-400 py-10 text-sm">No staff found.</p>
    <p id="loading-msg" class="text-center text-gray-400 py-10 text-sm">Loading…</p>
  </div>
</main>


<!-- ═══════════════════════════ ADD / EDIT MODAL ═══════════════════════════ -->
<div id="modal-staff" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md fade-in">
    <div class="px-6 py-4 border-b flex items-center justify-between">
      <h3 id="modal-title" class="font-bold text-lg text-gray-800">Add Staff</h3>
      <button onclick="closeModal('modal-staff')" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
    </div>
    <div class="px-6 py-5 space-y-4">
      <div id="modal-error" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-4 py-2"></div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Full Name *</label>
        <input id="f-full-name" type="text"
          class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Ram Prasad Sharma" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Username *</label>
          <input id="f-username" type="text"
            class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="ram.sharma" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Role *</label>
          <select id="f-role"
            class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="waiter">Waiter</option>
            <option value="cashier">Cashier</option>
            <option value="kitchen">Kitchen</option>
            <option value="admin">Admin</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">
          Password <span id="pw-required-label" class="text-red-500">*</span>
          <span id="pw-optional-label" class="hidden text-gray-400 font-normal">(leave blank to keep current)</span>
        </label>
        <input id="f-password" type="password" minlength="6"
          class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Min 6 characters" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">
          4-Digit PIN <span class="text-gray-400 font-normal">(optional — for quick POS login)</span>
        </label>
        <input id="f-pin" type="text" maxlength="4" pattern="\d{4}"
          oninput="this.value=this.value.replace(/\D/g,'')"
          class="w-full border rounded-lg px-3 py-2 text-sm font-mono tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="0000" />
      </div>
    </div>
    <div class="px-6 pb-5 flex justify-end gap-3">
      <button onclick="closeModal('modal-staff')"
        class="px-4 py-2 text-sm rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50">Cancel</button>
      <button id="modal-save-btn" onclick="saveStaff()"
        class="px-5 py-2 text-sm rounded-lg bg-blue-700 hover:bg-blue-800 text-white font-semibold">Save</button>
    </div>
  </div>
</div>


<!-- ═══════════════════════════ RESET PASSWORD MODAL ══════════════════════ -->
<div id="modal-reset-pw" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm fade-in">
    <div class="px-6 py-4 border-b flex items-center justify-between">
      <h3 class="font-bold text-gray-800">Reset Password</h3>
      <button onclick="closeModal('modal-reset-pw')" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
    </div>
    <div class="px-6 py-5 space-y-3">
      <p id="reset-pw-name" class="text-sm text-gray-500"></p>
      <div id="reset-pw-error" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-4 py-2"></div>
      <input id="new-password" type="password" placeholder="New password (min 6 chars)"
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>
    <div class="px-6 pb-5 flex justify-end gap-3">
      <button onclick="closeModal('modal-reset-pw')"
        class="px-4 py-2 text-sm rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50">Cancel</button>
      <button onclick="doResetPassword()"
        class="px-5 py-2 text-sm rounded-lg bg-orange-600 hover:bg-orange-700 text-white font-semibold">Reset</button>
    </div>
  </div>
</div>


<!-- ═══════════════════════════ RESET PIN MODAL ═══════════════════════════ -->
<div id="modal-reset-pin" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm fade-in">
    <div class="px-6 py-4 border-b flex items-center justify-between">
      <h3 class="font-bold text-gray-800">Reset PIN</h3>
      <button onclick="closeModal('modal-reset-pin')" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
    </div>
    <div class="px-6 py-5 space-y-3">
      <p id="reset-pin-name" class="text-sm text-gray-500"></p>
      <div id="reset-pin-error" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-4 py-2"></div>
      <input id="new-pin" type="text" maxlength="4" pattern="\d{4}"
        oninput="this.value=this.value.replace(/\D/g,'')"
        class="w-full border rounded-lg px-3 py-2 text-sm font-mono tracking-widest text-center text-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="0000" />
    </div>
    <div class="px-6 pb-5 flex justify-end gap-3">
      <button onclick="closeModal('modal-reset-pin')"
        class="px-4 py-2 text-sm rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50">Cancel</button>
      <button onclick="doResetPin()"
        class="px-5 py-2 text-sm rounded-lg bg-purple-700 hover:bg-purple-800 text-white font-semibold">Set PIN</button>
    </div>
  </div>
</div>


<script>
  const token = localStorage.getItem('token');
  const me    = JSON.parse(localStorage.getItem('user') || '{}');

  if (!token || !['admin', 'superadmin'].includes(me.role)) {
    window.location.href = '/login';
  }

  document.getElementById('nav-user').textContent = me.full_name || me.username || '';

  // ── State ──────────────────────────────────────────────────────────────────
  let allUsers  = [];
  let editingId = null;
  let actionId  = null;

  // ── API helper ─────────────────────────────────────────────────────────────
  async function api(path, opts = {}) {
    return fetch(path, {
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json',
                 ...(opts.headers || {}) },
      ...opts,
    });
  }

  // ── Role badge ─────────────────────────────────────────────────────────────
  function roleBadge(role) {
    const labels = { admin:'Admin', cashier:'Cashier', waiter:'Waiter', kitchen:'Kitchen' };
    return `<span class="text-xs font-bold px-2 py-0.5 rounded-full role-${role}">${labels[role] || role}</span>`;
  }

  // ── Load users ─────────────────────────────────────────────────────────────
  async function loadUsers() {
    document.getElementById('loading-msg').classList.remove('hidden');
    document.getElementById('empty-msg').classList.add('hidden');
    document.getElementById('users-tbody').innerHTML = '';

    const role   = document.getElementById('filter-role').value;
    const status = document.getElementById('filter-status').value;
    let url = '/api/users';
    const params = [];
    if (role)   params.push(`role=${encodeURIComponent(role)}`);
    if (status) params.push(`is_active=${status}`);
    if (params.length) url += '?' + params.join('&');

    const res = await api(url);
    document.getElementById('loading-msg').classList.add('hidden');
    if (!res.ok) { alert('Failed to load staff list'); return; }
    allUsers = await res.json();
    renderTable();
  }

  // ── Render table ───────────────────────────────────────────────────────────
  function renderTable() {
    const q = document.getElementById('filter-search').value.toLowerCase();
    const filtered = allUsers.filter(u =>
      u.full_name.toLowerCase().includes(q) || u.username.toLowerCase().includes(q)
    );

    const tbody = document.getElementById('users-tbody');
    const empty = document.getElementById('empty-msg');

    if (!filtered.length) { empty.classList.remove('hidden'); tbody.innerHTML = ''; return; }
    empty.classList.add('hidden');

    const isSelf = (u) => u.id === me.id;

    tbody.innerHTML = filtered.map(u => `
      <tr class="border-b hover:bg-gray-50 transition-colors ${u.role === 'admin' ? 'bg-blue-50/30' : ''}">
        <td class="px-5 py-3">
          <div class="font-medium text-gray-800">${esc(u.full_name)}</div>
          ${isSelf(u) ? '<span class="text-xs text-blue-500 font-semibold">(you)</span>' : ''}
        </td>
        <td class="px-4 py-3 font-mono text-xs text-gray-600">${esc(u.username)}</td>
        <td class="px-4 py-3">${roleBadge(u.role)}</td>
        <td class="px-4 py-3 text-center">
          ${u.has_pin
            ? '<span class="text-green-600 text-xs font-bold">✓ Set</span>'
            : '<span class="text-gray-300 text-xs">—</span>'}
        </td>
        <td class="px-4 py-3">
          <span class="text-xs font-bold px-2 py-0.5 rounded-full ${u.is_active
            ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'}">
            ${u.is_active ? 'Active' : 'Inactive'}
          </span>
        </td>
        <td class="px-4 py-3 text-xs text-gray-400">
          ${u.last_login ? new Date(u.last_login).toLocaleString() : '—'}
        </td>
        <td class="px-4 py-3">
          <div class="flex flex-wrap gap-1.5">
            <button onclick="openEditModal(${u.id})"
              class="text-xs px-2.5 py-1 rounded border border-blue-300 text-blue-600 hover:bg-blue-50">
              Edit
            </button>
            <button onclick="openResetPassword(${u.id}, '${esc(u.full_name)}')"
              class="text-xs px-2.5 py-1 rounded border border-orange-300 text-orange-600 hover:bg-orange-50">
              Password
            </button>
            <button onclick="openResetPin(${u.id}, '${esc(u.full_name)}')"
              class="text-xs px-2.5 py-1 rounded border border-purple-300 text-purple-600 hover:bg-purple-50">
              PIN
            </button>
            ${isSelf(u) ? '' : `
            <button onclick="toggleActive(${u.id}, ${u.is_active})"
              class="text-xs px-2.5 py-1 rounded border ${u.is_active
                ? 'border-red-300 text-red-600 hover:bg-red-50'
                : 'border-green-300 text-green-600 hover:bg-green-50'}">
              ${u.is_active ? 'Deactivate' : 'Activate'}
            </button>`}
          </div>
        </td>
      </tr>`).join('');
  }

  // ── XSS escape ─────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // ── Modal helpers ──────────────────────────────────────────────────────────
  function openModal(id)  { document.getElementById(id).classList.remove('hidden'); }
  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

  function clearModalError(errId) {
    const el = document.getElementById(errId);
    el.textContent = '';
    el.classList.add('hidden');
  }
  function showModalError(errId, msg) {
    const el = document.getElementById(errId);
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  // ── Add modal ──────────────────────────────────────────────────────────────
  function openAddModal() {
    editingId = null;
    document.getElementById('modal-title').textContent = 'Add Staff Member';
    document.getElementById('f-full-name').value = '';
    document.getElementById('f-username').value  = '';
    document.getElementById('f-password').value  = '';
    document.getElementById('f-pin').value       = '';
    document.getElementById('f-role').value      = 'waiter';
    document.getElementById('pw-required-label').classList.remove('hidden');
    document.getElementById('pw-optional-label').classList.add('hidden');
    document.getElementById('f-password').required = true;
    clearModalError('modal-error');
    openModal('modal-staff');
    document.getElementById('f-full-name').focus();
  }

  // ── Edit modal ─────────────────────────────────────────────────────────────
  function openEditModal(id) {
    const u = allUsers.find(x => x.id === id);
    if (!u) return;
    editingId = id;
    document.getElementById('modal-title').textContent = 'Edit Staff Member';
    document.getElementById('f-full-name').value = u.full_name;
    document.getElementById('f-username').value  = u.username;
    document.getElementById('f-password').value  = '';
    document.getElementById('f-pin').value       = '';
    document.getElementById('f-role').value      = u.role;
    document.getElementById('pw-required-label').classList.add('hidden');
    document.getElementById('pw-optional-label').classList.remove('hidden');
    document.getElementById('f-password').required = false;
    clearModalError('modal-error');
    openModal('modal-staff');
    document.getElementById('f-full-name').focus();
  }

  // ── Save (add or edit) ─────────────────────────────────────────────────────
  async function saveStaff() {
    const btn = document.getElementById('modal-save-btn');
    clearModalError('modal-error');

    const fullName = document.getElementById('f-full-name').value.trim();
    const username = document.getElementById('f-username').value.trim();
    const password = document.getElementById('f-password').value;
    const role     = document.getElementById('f-role').value;
    const pin      = document.getElementById('f-pin').value.trim();

    if (!fullName || !username || !role) {
      return showModalError('modal-error', 'Full name, username, and role are required.');
    }
    if (!editingId && !password) {
      return showModalError('modal-error', 'Password is required for new staff.');
    }
    if (password && password.length < 6) {
      return showModalError('modal-error', 'Password must be at least 6 characters.');
    }
    if (pin && (!/^\d{4}$/.test(pin))) {
      return showModalError('modal-error', 'PIN must be exactly 4 digits.');
    }

    btn.textContent = 'Saving…';
    btn.disabled = true;

    try {
      let res, data;
      if (!editingId) {
        // Create
        const body = { full_name: fullName, username, password, role };
        if (pin) body.pin = pin;
        res  = await api('/api/users', { method: 'POST', body: JSON.stringify(body) });
        data = await res.json();
      } else {
        // Update
        const body = { full_name: fullName, username, role };
        if (pin) body.pin = pin;
        res  = await api(`/api/users/${editingId}`, { method: 'PUT', body: JSON.stringify(body) });
        data = await res.json();

        // Reset password separately if provided
        if (password) {
          const pwRes = await api(`/api/users/${editingId}/reset-password`, {
            method: 'PATCH',
            body: JSON.stringify({ new_password: password }),
          });
          if (!pwRes.ok) {
            const pwData = await pwRes.json();
            return showModalError('modal-error', pwData.detail || 'Password reset failed.');
          }
        }
      }

      if (!res.ok) {
        return showModalError('modal-error', data.detail || 'Save failed.');
      }

      closeModal('modal-staff');
      loadUsers();
    } catch {
      showModalError('modal-error', 'Connection error. Try again.');
    } finally {
      btn.textContent = 'Save';
      btn.disabled = false;
    }
  }

  // ── Toggle active ──────────────────────────────────────────────────────────
  async function toggleActive(id, currentlyActive) {
    const action = currentlyActive ? 'deactivate' : 'activate';
    const u = allUsers.find(x => x.id === id);
    const msg = currentlyActive
      ? `Deactivate ${u?.full_name}? They won't be able to log in.`
      : `Activate ${u?.full_name}?`;
    if (!confirm(msg)) return;
    const res = await api(`/api/users/${id}/${action}`, { method: 'PATCH' });
    if (res.ok) {
      loadUsers();
    } else {
      const d = await res.json();
      alert(d.detail || 'Action failed');
    }
  }

  // ── Reset password modal ───────────────────────────────────────────────────
  function openResetPassword(id, name) {
    actionId = id;
    document.getElementById('reset-pw-name').textContent = `For: ${name}`;
    document.getElementById('new-password').value = '';
    clearModalError('reset-pw-error');
    openModal('modal-reset-pw');
    document.getElementById('new-password').focus();
  }

  async function doResetPassword() {
    clearModalError('reset-pw-error');
    const pw = document.getElementById('new-password').value;
    if (!pw || pw.length < 6) return showModalError('reset-pw-error', 'Password must be at least 6 characters.');
    const res = await api(`/api/users/${actionId}/reset-password`, {
      method: 'PATCH',
      body: JSON.stringify({ new_password: pw }),
    });
    if (res.ok) {
      closeModal('modal-reset-pw');
      alert('Password reset successfully.');
    } else {
      const d = await res.json();
      showModalError('reset-pw-error', d.detail || 'Reset failed.');
    }
  }

  // ── Reset PIN modal ────────────────────────────────────────────────────────
  function openResetPin(id, name) {
    actionId = id;
    document.getElementById('reset-pin-name').textContent = `For: ${name}`;
    document.getElementById('new-pin').value = '';
    clearModalError('reset-pin-error');
    openModal('modal-reset-pin');
    document.getElementById('new-pin').focus();
  }

  async function doResetPin() {
    clearModalError('reset-pin-error');
    const pin = document.getElementById('new-pin').value.trim();
    if (!/^\d{4}$/.test(pin)) return showModalError('reset-pin-error', 'PIN must be exactly 4 digits.');
    const res = await api(`/api/users/${actionId}/reset-pin`, {
      method: 'PATCH',
      body: JSON.stringify({ new_pin: pin }),
    });
    if (res.ok) {
      closeModal('modal-reset-pin');
      alert('PIN reset successfully.');
      loadUsers();
    } else {
      const d = await res.json();
      showModalError('reset-pin-error', d.detail || 'Reset failed.');
    }
  }

  // ── Close on backdrop click ────────────────────────────────────────────────
  ['modal-staff','modal-reset-pw','modal-reset-pin'].forEach(id => {
    document.getElementById(id).addEventListener('click', function(e) {
      if (e.target === this) closeModal(id);
    });
  });

  // ── Enter key for modals ───────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      ['modal-staff','modal-reset-pw','modal-reset-pin'].forEach(closeModal);
    }
  });

  function logout() {
    localStorage.clear();
    window.location.href = '/login';
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  loadUsers();
</script>
</body>
</html>
