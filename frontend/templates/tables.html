<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floor Plan — Restaurant POS</title>
  <script src="/static/vendor/tailwindcss-3.4.17.js"></script>
  <script src="/static/js/pos.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<div id="pos-nav"></div>

<!-- Toolbar -->
<div class="bg-white border-b shadow-sm sticky top-14 z-30">
  <div class="px-3 sm:px-4 py-2 flex flex-wrap items-center gap-2">
    <div id="floor-tabs" class="flex gap-1 overflow-x-auto"></div>
    <div class="flex-1"></div>
    <div id="legend" class="hidden sm:flex items-center gap-3 text-sm text-gray-600 mr-2"></div>
    <a href="/orders?type=takeaway" class="px-3 py-2 rounded-lg bg-gray-900 text-white text-sm font-semibold hover:bg-gray-800">🥡 Takeaway</a>
    <a href="/orders?type=delivery" class="px-3 py-2 rounded-lg bg-gray-900 text-white text-sm font-semibold hover:bg-gray-800">🛵 Delivery</a>
    <a href="/reservations" class="px-3 py-2 rounded-lg bg-amber-100 text-amber-900 text-sm font-semibold hover:bg-amber-200">
      📅 Bookings <span id="bookings-count" class="hidden bg-amber-500 text-white rounded-full px-1.5 text-xs ml-0.5"></span></a>
    <button id="btn-edit" onclick="toggleEdit()" class="hidden px-3 py-2 rounded-lg border text-sm font-medium hover:bg-gray-50">✏️ Edit tables</button>
  </div>
  <div id="edit-banner" class="hidden bg-blue-50 border-t border-blue-100 px-4 py-2 text-sm text-blue-800 flex items-center gap-3">
    <span>Edit mode — tap a table to change it.</span>
    <button onclick="openTableForm()" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white font-semibold">+ Add table</button>
    <button onclick="toggleEdit()" class="ml-auto underline">Done</button>
  </div>
</div>

<main class="p-3 sm:p-4 space-y-5">
  <div id="tables-grid" class="grid gap-3" style="grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));"></div>
  <div id="empty" class="hidden text-center py-20 text-gray-500">
    <div class="text-5xl mb-3">🪑</div>
    <p class="font-semibold">No tables yet</p>
    <p class="text-sm mt-1" id="empty-hint">Ask an admin to add tables — or take a takeaway order.</p>
  </div>

  <section id="open-orders-wrap" class="hidden">
    <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-2">Takeaway & delivery in progress</h2>
    <div id="open-orders" class="grid gap-3" style="grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));"></div>
  </section>
</main>

<script>
const { api, esc, money, toast, fail } = POS;
const ME = POS.user();
const IS_ADMIN = ['admin', 'superadmin'].includes(ME.role);
let DATA = { tables: [], floors: [], open_orders: [], counts: {} };
let floor = localStorage.getItem('pos.floor') || 'all';
let editMode = false;

async function init() {
  if (!POS.guard(['admin', 'cashier', 'waiter', 'superadmin'])) return;
  POS.nav('/tables');
  if (IS_ADMIN) document.getElementById('btn-edit').classList.remove('hidden');
  showFlash();
  await load();
  setInterval(() => { if (!document.hidden) load(); }, 10000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  document.addEventListener('pos:served', load);
}

function showFlash() {
  const raw = sessionStorage.getItem('pos.flash');
  if (!raw) return;
  sessionStorage.removeItem('pos.flash');
  try {
    const f = JSON.parse(raw);
    if (f.kot && f.autoPrint) POS.printKot(f.kot[0], f.kot[1]);
    toast(f.message, f.kot && !f.autoPrint && !f.thermal
      ? { action: { label: 'Print KOT', fn: () => POS.printKot(f.kot[0], f.kot[1]) } } : {});
  } catch { /* ignore */ }
}

async function load() {
  try {
    DATA = await api('/api/tables/overview');
  } catch (e) { fail(e); return; }
  if (floor !== 'all' && !DATA.floors.includes(floor)) floor = 'all';
  render();
}

function render() {
  // Floor tabs (only when there is more than one floor)
  const tabs = document.getElementById('floor-tabs');
  tabs.innerHTML = DATA.floors.length > 1
    ? ['all', ...DATA.floors].map((f, i) => `<button onclick="setFloorIdx(${i})"
        class="px-3 py-2 rounded-lg text-sm font-semibold whitespace-nowrap ${floor === f ? 'bg-blue-600 text-white' : 'text-gray-600 hover:bg-gray-100'}">
        ${f === 'all' ? 'All floors' : esc(f)}</button>`).join('')
    : '<span class="font-bold text-gray-800 px-1">Floor plan</span>';

  const c = DATA.counts;
  document.getElementById('legend').innerHTML = `
    <span class="flex items-center gap-1.5">${tableIcon(false, 'h-5 w-auto text-green-600')}${c.free || 0} free</span>
    <span class="flex items-center gap-1.5">${tableIcon(true, 'h-5 w-auto text-red-600')}${c.occupied || 0} busy</span>
    <span class="flex items-center gap-1.5">${tableIcon(false, 'h-5 w-auto text-amber-500')}${c.reserved || 0} booked</span>`;
  const bc = document.getElementById('bookings-count');
  bc.textContent = DATA.bookings_today;
  bc.classList.toggle('hidden', !DATA.bookings_today);

  const tables = DATA.tables.filter(t => floor === 'all' || t.floor === floor);
  document.getElementById('tables-grid').innerHTML = tables.map(card).join('');
  document.getElementById('empty').classList.toggle('hidden', DATA.tables.length > 0);
  if (IS_ADMIN) document.getElementById('empty-hint').innerHTML =
    'Click <b>✏️ Edit tables</b> above, then <b>+ Add table</b>.';

  const oo = DATA.open_orders;
  document.getElementById('open-orders-wrap').classList.toggle('hidden', !oo.length);
  document.getElementById('open-orders').innerHTML = oo.map(o => `
    <a href="/orders?order_id=${o.id}" class="bg-white rounded-xl shadow-sm border-l-4 ${o.order_type === 'delivery' ? 'border-purple-500' : 'border-blue-500'} p-3 hover:shadow-md transition block">
      <div class="flex items-center justify-between">
        <span class="font-bold">${o.order_type === 'delivery' ? '🛵' : '🥡'} #${o.id}</span>
        <span class="text-xs text-gray-500">${POS.duration(o.minutes_open)}</span>
      </div>
      <div class="text-sm text-gray-700 truncate">${esc(o.customer_name || POS.label(o.order_type))}</div>
      <div class="flex items-center justify-between mt-1">
        <span class="font-semibold text-sm">${money(o.estimated_total)}</span>
        ${badges(o)}
      </div>
    </a>`).join('');
}

function badges(o) {
  return `<span class="flex flex-wrap gap-1">
    ${o.ready ? `<span class="text-[11px] font-bold bg-green-500 text-white rounded-full px-2 py-0.5 animate-pulse">🔔 ${o.ready} ready</span>` : ''}
    ${o.awaiting_accept ? `<span class="text-[11px] font-bold bg-yellow-100 text-yellow-800 rounded-full px-2 py-0.5">⏳ ${o.awaiting_accept} to accept</span>` : ''}
    ${o.pending ? `<span class="text-[11px] font-bold bg-orange-100 text-orange-800 rounded-full px-2 py-0.5">${o.pending} not sent</span>` : ''}
  </span>`;
}

// ── Table icon: a table with two chairs; guests sit in them when it's occupied ──
// Drawn in a 1200-unit square as round-capped lines (like a line icon font).
const ICON_TABLE = `
  <path d="M384 528H816L886 1004Q792 1050 696 1020Q600 1050 504 1020Q408 1050 314 1004Z"/>
  <path d="M504 866V1020M696 912V1020"/>`;
const ICON_CHAIRS = `
  <path d="M72 408V745C72 783 104 815 144 815H318M118 822L96 1030"/>
  <path d="M1128 408V745C1128 783 1096 815 1056 815H882M1082 822L1104 1030"/>`;
const ICON_GUESTS = `
  <circle cx="216" cy="240" r="72"/><circle cx="984" cy="240" r="72"/>
  <path d="M345 648H288V460C288 420 260 384 216 384C176 384 144 416 144 455V672C144 712 176 744 216 744H330"/>
  <path d="M855 648H912V460C912 420 940 384 984 384C1024 384 1056 416 1056 455V672C1056 712 1024 744 984 744H870"/>`;

function tableIcon(withGuests, cls) {
  return `<svg viewBox="24 144 1152 910" class="${cls}" fill="none" stroke="currentColor" stroke-width="48"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    ${ICON_TABLE}${ICON_CHAIRS}${withGuests ? ICON_GUESTS : ''}</svg>`;
}

function card(t) {
  const o = t.order, r = t.reservation;
  const base = 'relative text-left rounded-2xl p-3 flex flex-col shadow-sm border-2 transition active:scale-[.98] hover:shadow-md';
  const icon = (guests, color) => `<div class="flex justify-center my-1.5">${tableIcon(guests, `h-16 w-auto ${color}`)}</div>`;
  if (t.status === 'occupied') {
    const late = o.minutes_open >= 90;
    return `<button onclick="tapTable(${t.id})" class="${base} bg-red-50 border-red-400" aria-label="Table ${esc(t.table_number)}, occupied">
      <div class="flex items-start justify-between">
        <span class="text-xl font-extrabold text-red-700">${esc(t.table_number)}</span>
        <span class="text-xs font-semibold ${late ? 'text-red-600' : 'text-gray-500'}">⏱ ${POS.duration(o.minutes_open)}</span>
      </div>
      ${icon(true, 'text-red-600')}
      <div class="font-bold text-gray-900 text-sm">${money(o.estimated_total)}</div>
      <div class="text-xs text-gray-600 truncate">👥 ${o.guests || '–'}/${t.capacity}${o.waiter_name ? ' · ' + esc(o.waiter_name.split(' ')[0]) : ''}</div>
      <div class="mt-1 min-h-[20px]">${badges(o)}${o.bill_open ? '<span class="text-[11px] font-bold bg-purple-100 text-purple-800 rounded-full px-2 py-0.5">🧾 bill issued</span>' : ''}</div>
    </button>`;
  }
  if (t.status === 'reserved') {
    return `<button onclick="tapTable(${t.id})" class="${base} bg-amber-50 border-amber-400" aria-label="Table ${esc(t.table_number)}, booked">
      <div class="flex items-start justify-between">
        <span class="text-xl font-extrabold text-amber-800">${esc(t.table_number)}</span>
        <span class="text-xs font-bold text-amber-800 bg-amber-200 rounded-full px-2 py-0.5">Booked</span>
      </div>
      ${icon(false, 'text-amber-500')}
      ${r ? `<div class="text-sm font-semibold text-gray-800 truncate">${esc(r.customer_name)}</div>
             <div class="text-xs text-gray-600">🕒 ${POS.time(r.reserved_for)} · 👥 ${r.party_size}</div>`
          : '<div class="text-xs text-gray-600">Held by staff</div>'}
    </button>`;
  }
  return `<button onclick="tapTable(${t.id})" class="${base} bg-white border-green-300 hover:border-green-500" aria-label="Table ${esc(t.table_number)}, free">
    <div class="flex items-start justify-between">
      <span class="text-xl font-extrabold text-gray-800">${esc(t.table_number)}</span>
      <span class="text-xs text-gray-500">${t.capacity} seats</span>
    </div>
    ${icon(false, 'text-green-600')}
    <div class="text-sm font-semibold text-green-700">Free — tap to order</div>
    ${DATA.floors.length > 1 && floor === 'all' ? `<div class="text-xs text-gray-400">${esc(t.floor)}</div>` : ''}
  </button>`;
}

function setFloorIdx(i) {
  const f = ['all', ...DATA.floors][i] || 'all';
  floor = f;
  localStorage.setItem('pos.floor', f);
  render();
}

async function tapTable(id) {
  const t = DATA.tables.find(x => x.id === id);
  if (!t) return;
  if (editMode) { openTableForm(t); return; }
  if (t.status !== 'reserved') { location.href = `/orders?table_id=${id}`; return; }

  const r = t.reservation;
  const choice = await POS.modal(`
    <h2 class="text-lg font-bold">Table ${esc(t.table_number)} is booked</h2>
    ${r ? `<p class="text-gray-600 mt-1">${esc(r.customer_name)} · 👥 ${r.party_size} · ${POS.time(r.reserved_for)}</p>
           ${r.customer_phone ? `<a href="tel:${esc(r.customer_phone)}" class="text-blue-700 text-sm">📞 ${esc(r.customer_phone)}</a>` : ''}
           ${r.notes ? `<p class="text-sm text-amber-800 mt-1">📝 ${esc(r.notes)}</p>` : ''}`
        : '<p class="text-gray-600 mt-1">This table was held by a staff member.</p>'}
    <div class="grid gap-2 mt-5">
      ${r ? '<button data-c="seat" class="py-3.5 rounded-xl bg-green-600 hover:bg-green-700 text-white font-bold">✓ Guests arrived — seat them</button>' : ''}
      <button data-c="walkin" class="py-3 rounded-xl border font-semibold hover:bg-gray-50">${r ? 'Seat walk-in guests instead' : 'Take order'}</button>
      ${!r ? '<button data-c="free" class="py-3 rounded-xl border font-semibold hover:bg-gray-50">Release table</button>' : ''}
      <button data-c="close" class="py-3 rounded-xl text-gray-500">Close</button>
    </div>`, {
    onMount: (w, close) => w.querySelectorAll('[data-c]').forEach(b => b.onclick = () => close(b.dataset.c)),
  });
  try {
    if (choice === 'seat') {
      const res = await api(`/api/reservations/${r.id}/seat`, { method: 'POST', body: {} });
      location.href = `/orders?order_id=${res.order.id}`;
    } else if (choice === 'walkin') {
      if (r && !(await POS.confirm(`${r.customer_name} is booked for ${POS.time(r.reserved_for)}. Seat walk-ins here anyway?`, { okText: 'Seat anyway' }))) return;
      location.href = `/orders?table_id=${id}`;
    } else if (choice === 'free') {
      await api(`/api/tables/${id}/status`, { method: 'PATCH', body: { status: 'free' } });
      load();
    }
  } catch (e) { fail(e); }
}

// ── Admin: add / edit tables ────────────────────────────────────────────────
function toggleEdit() {
  editMode = !editMode;
  document.getElementById('edit-banner').classList.toggle('hidden', !editMode);
  document.getElementById('edit-banner').classList.toggle('flex', editMode);
  document.getElementById('btn-edit').textContent = editMode ? '✓ Done editing' : '✏️ Edit tables';
}

async function openTableForm(t = null) {
  const floors = DATA.floors.length ? DATA.floors : ['Ground', 'First', 'Rooftop'];
  const result = await POS.modal(`
    <form class="space-y-3">
      <h2 class="text-lg font-bold">${t ? 'Edit table ' + esc(t.table_number) : 'Add table'}</h2>
      <label class="block text-sm font-medium text-gray-700">Table name / number
        <input name="table_number" required value="${esc(t ? t.table_number : '')}" placeholder="T1, VIP-1…" class="mt-1 w-full border rounded-lg px-3 py-2.5"></label>
      <label class="block text-sm font-medium text-gray-700">Seats
        <input name="capacity" type="number" min="1" max="100" required value="${t ? t.capacity : 4}" class="mt-1 w-full border rounded-lg px-3 py-2.5"></label>
      <label class="block text-sm font-medium text-gray-700">Floor / area
        <input name="floor" list="floor-list" value="${esc(t ? t.floor : floors[0])}" class="mt-1 w-full border rounded-lg px-3 py-2.5">
        <datalist id="floor-list">${floors.map(f => `<option value="${esc(f)}">`).join('')}</datalist></label>
      <p data-err class="hidden text-sm text-red-600"></p>
      <div class="flex gap-2 pt-1">
        ${t ? '<button type="button" data-del class="px-4 py-3 rounded-xl border border-red-200 text-red-600 font-medium">Delete</button>' : ''}
        <button type="button" data-x class="flex-1 py-3 rounded-xl border font-medium">Cancel</button>
        <button class="flex-1 py-3 rounded-xl bg-blue-600 text-white font-semibold">Save</button>
      </div>
    </form>`, {
    onMount: (w, close) => {
      const err = w.querySelector('[data-err]');
      w.querySelector('[data-x]').onclick = () => close(null);
      const del = w.querySelector('[data-del]');
      if (del) del.onclick = async () => {
        if (!(await POS.confirm(`Delete table ${t.table_number}?`, { danger: true, okText: 'Delete' }))) return;
        try { await api(`/api/tables/${t.id}`, { method: 'DELETE' }); close('saved'); }
        catch (e) { err.textContent = e.message; err.classList.remove('hidden'); }
      };
      w.querySelector('form').onsubmit = async e => {
        e.preventDefault();
        const f = Object.fromEntries(new FormData(e.target));
        const body = { table_number: f.table_number.trim(), capacity: Number(f.capacity), floor: f.floor.trim() || 'Ground' };
        try {
          await api(t ? `/api/tables/${t.id}` : '/api/tables', { method: t ? 'PUT' : 'POST', body });
          close('saved');
        } catch (ex) { err.textContent = ex.message; err.classList.remove('hidden'); }
      };
    },
  });
  if (result === 'saved') { toast('Tables updated'); load(); }
}

init();
</script>
</body>
</html>
