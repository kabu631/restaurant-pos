<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitchen Display — Restaurant POS</title>
  <script src="/static/vendor/tailwindcss-3.4.17.js"></script>
  <script src="/static/js/pos.js"></script>
  <style>
    @keyframes flash-new { 0%, 100% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0); } 50% { box-shadow: 0 0 0 6px rgba(250, 204, 21, .9); } }
    .is-new { animation: flash-new 1s ease-in-out 4; }
    body.kds-lg .kds-item { font-size: 1.35rem; }
    body.kds-lg .kds-qty { font-size: 2rem; }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col select-none">

<div id="pos-nav"></div>

<!-- KDS toolbar -->
<div class="bg-gray-900 border-b border-gray-800 px-3 sm:px-4 py-2 flex flex-wrap items-center gap-2 shrink-0">
  <span class="text-lg font-extrabold tracking-wide text-orange-400 mr-1">KITCHEN</span>
  <div id="station-tabs" class="flex gap-1"></div>
  <div class="flex-1"></div>
  <span id="updated" class="text-xs text-gray-500 hidden sm:block"></span>
  <button id="btn-sound" onclick="toggleSound()" class="px-3 py-2 rounded-lg text-sm font-semibold"></button>
  <button onclick="toggleSize()" class="px-3 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-sm font-semibold" title="Text size">A±</button>
  <button onclick="toggleFullscreen()" class="px-3 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-sm font-semibold" title="Full screen">⛶</button>
</div>

<div class="bg-gray-900/60 border-b border-gray-800 px-4 py-1.5 flex items-center gap-5 text-xs text-gray-400">
  <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-yellow-400"></span>New — accept it</span>
  <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-orange-500"></span>Accepted · cooking</span>
  <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-green-500"></span>Ready</span>
  <span class="hidden sm:inline">· Accepting sends the table's total to the cashier · Timer turns amber at 5 min, red at 10 min</span>
</div>

<main class="flex-1 p-3 sm:p-4 overflow-y-auto">
  <div id="grid" class="grid gap-3 items-start" style="grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));"></div>
  <div id="empty" class="hidden flex-col items-center justify-center py-24 text-gray-600">
    <div class="text-6xl mb-3">✅</div>
    <p class="text-2xl font-semibold">All caught up!</p>
    <p class="text-sm mt-1">New orders appear here automatically.</p>
  </div>
</main>

<script>
const { api, esc, toast, fail } = POS;
let tickets = [];
let fetchedAt = Date.now();
let station = localStorage.getItem('kds.station') || 'all';
let known = null;          // ticket keys seen so far (null until first load)
let soundOn = localStorage.getItem('kds.sound') !== 'off';
const STATUS = {
  sent:      ['NEW', 'bg-yellow-400 text-yellow-950'],
  preparing: ['ACCEPTED', 'bg-orange-500 text-white'],
  ready:     ['READY', 'bg-green-500 text-white'],
};

function key(t) { return `${t.order_id}-${t.kot_number}`; }

async function init() {
  if (!POS.guard(['admin', 'cashier', 'waiter', 'kitchen', 'superadmin'])) return;
  POS.nav('/kitchen', { readyAlerts: false });
  if (localStorage.getItem('kds.size') === 'lg') document.body.classList.add('kds-lg');
  renderSoundBtn();
  await load();
  setInterval(() => { if (!document.hidden) load(); }, 4000);
  setInterval(tickTimers, 1000);
}

async function load() {
  try {
    tickets = await api('/api/kitchen/tickets');
    fetchedAt = Date.now();
  } catch (e) {
    document.getElementById('updated').textContent = '⚠ Connection lost — retrying…';
    return;
  }
  const keys = new Set(tickets.map(key));
  const fresh = known ? tickets.filter(t => !known.has(key(t)) && visibleItems(t).length) : [];
  if (fresh.length && soundOn) POS.beep(3, 880);
  const freshKeys = new Set(fresh.map(key));
  known = keys;
  render(freshKeys);
  document.getElementById('updated').textContent = 'Updated ' + POS.time(new Date().toISOString());
}

function visibleItems(t) {
  return station === 'all' ? t.items : t.items.filter(i => i.station === station);
}

function render(freshKeys = new Set()) {
  const counts = { all: 0, kitchen: 0, bar: 0 };
  tickets.forEach(t => {
    counts.all++;
    if (t.stations.includes('kitchen')) counts.kitchen++;
    if (t.stations.includes('bar')) counts.bar++;
  });
  const tabs = counts.bar ? ['all', 'kitchen', 'bar'] : ['all'];
  if (!tabs.includes(station)) station = 'all';
  document.getElementById('station-tabs').innerHTML = tabs.map(s => `
    <button onclick="setStation('${s}')" class="px-3 py-2 rounded-lg text-sm font-semibold ${station === s ? 'bg-orange-500 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}">
      ${s === 'all' ? 'All' : s === 'kitchen' ? '🍳 Kitchen' : '🍹 Bar'} <span class="opacity-80">${counts[s]}</span></button>`).join('');

  const shown = tickets.filter(t => visibleItems(t).length);
  document.getElementById('grid').innerHTML = shown.map(t => ticketHtml(t, freshKeys.has(key(t)))).join('');
  const empty = document.getElementById('empty');
  empty.classList.toggle('hidden', shown.length > 0);
  empty.classList.toggle('flex', shown.length === 0);
  tickTimers();
}

function ticketHtml(t, isNew) {
  const items = visibleItems(t);
  const statuses = new Set(items.map(i => i.kot_status));
  const action = statuses.has('sent') ? ['✓ Accept order', 'bg-yellow-500 hover:bg-yellow-400 text-black']
               : statuses.has('preparing') ? ['✓ All ready', 'bg-green-600 hover:bg-green-700']
               : ['🍽 Served — clear', 'bg-blue-600 hover:bg-blue-700'];
  const where = t.table_number ? `Table ${esc(t.table_number)}`
              : t.order_type === 'delivery' ? '🛵 Delivery' : '🥡 Takeaway';
  return `<article data-key="${key(t)}" data-age="${t.age_sec}" class="rounded-2xl bg-gray-900 border-2 border-gray-700 overflow-hidden ${isNew ? 'is-new' : ''}">
    <header class="px-4 py-2.5 flex items-center justify-between gap-2 bg-gray-800">
      <div>
        <div class="text-xl font-extrabold">${t.stations.length === 1 && t.stations[0] === 'bar' ? 'BOT' : 'KOT'} #${t.kot_number ?? '–'}</div>
        <div class="text-xs text-gray-400">${POS.time(t.sent_at)}${t.waiter_name ? ' · ' + esc(t.waiter_name) : ''}${t.guests ? ' · 👥 ' + t.guests : ''}</div>
      </div>
      <div class="text-right">
        <div class="text-lg font-bold text-orange-300">${where}</div>
        <div class="timer font-mono text-lg font-bold">--:--</div>
      </div>
    </header>
    ${t.customer_name && !t.table_number ? `<div class="px-4 py-1 bg-gray-800/60 text-sm text-gray-300">👤 ${esc(t.customer_name)}</div>` : ''}
    ${t.order_notes ? `<div class="px-4 py-1.5 bg-yellow-900/40 text-yellow-200 text-sm border-y border-yellow-800">📝 ${esc(t.order_notes)}</div>` : ''}
    <div class="divide-y divide-gray-800">
      ${items.map(i => {
        const [txt, cls] = STATUS[i.kot_status] || [i.kot_status, 'bg-gray-600'];
        return `<button onclick="bump(${i.id})" class="w-full text-left px-4 py-3 flex items-center gap-3 hover:bg-gray-800/70 active:bg-gray-800">
          <span class="kds-qty text-2xl font-extrabold w-9 text-center ${i.kot_status === 'ready' ? 'text-green-400' : ''}">${i.quantity}</span>
          <span class="flex-1 min-w-0">
            <span class="kds-item block font-semibold text-lg leading-snug ${i.kot_status === 'ready' ? 'text-green-300' : ''}">${esc(i.name)}</span>
            ${i.notes ? `<span class="block text-sm text-yellow-300 font-semibold">⚠ ${esc(i.notes)}</span>` : ''}
          </span>
          <span class="text-[11px] font-bold px-2 py-1 rounded-md ${cls}">${txt}</span>
        </button>`;
      }).join('')}
    </div>
    <footer class="p-2.5 flex gap-2 bg-gray-800/50">
      <button onclick="POS.printKot(${t.order_id}, ${t.kot_number})" class="px-3 py-3 rounded-xl bg-gray-700 hover:bg-gray-600 text-sm" title="Print">🖨</button>
      <button onclick="advance(${t.order_id}, ${t.kot_number})" class="flex-1 py-3 rounded-xl text-base font-bold ${action[1]}">${action[0]}</button>
    </footer>
  </article>`;
}

function tickTimers() {
  const extra = Math.floor((Date.now() - fetchedAt) / 1000);
  document.querySelectorAll('#grid article').forEach(card => {
    const secs = Number(card.dataset.age) + extra;
    const m = Math.floor(secs / 60), s = secs % 60;
    const timer = card.querySelector('.timer');
    timer.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const late = secs >= 600, slow = secs >= 300;
    timer.className = `timer font-mono text-lg font-bold ${late ? 'text-red-400 animate-pulse' : slow ? 'text-amber-300' : 'text-gray-300'}`;
    card.classList.toggle('border-red-500', late);
    card.classList.toggle('border-amber-400', slow && !late);
    card.classList.toggle('border-gray-700', !slow);
  });
}

function setStation(s) {
  station = s;
  localStorage.setItem('kds.station', s);
  render();
}

// ── Actions (each can be undone for a few seconds) ─────────────────────────
function offerUndo(changes, message) {
  if (!changes.length) return;
  toast(message, {
    action: {
      label: 'Undo',
      fn: async () => {
        try {
          await Promise.all(changes.map(c => api(`/api/kitchen/items/${c.id}/status`, {
            method: 'PATCH', body: { kot_status: c.previous },
          })));
          load();
        } catch (e) { fail(e); }
      },
    },
  });
}

async function bump(itemId) {
  try {
    const r = await api(`/api/kitchen/items/${itemId}/bump`, { method: 'PATCH' });
    await load();
    offerUndo([{ id: r.id, previous: r.previous }], `Moved to ${r.kot_status}`);
  } catch (e) { fail(e); }
}

async function advance(orderId, kotNumber) {
  try {
    const q = station === 'all' ? '' : `?station=${station}`;
    const r = await api(`/api/kitchen/tickets/${orderId}/${kotNumber}/advance${q}`, { method: 'PATCH' });
    await load();
    const words = { preparing: 'Order accepted — the cashier now has this table', ready: 'Marked ready — waiters notified', served: 'Ticket cleared' };
    offerUndo(r.changed, words[r.kot_status] || 'Updated');
  } catch (e) { fail(e); }
}

// ── Screen options ─────────────────────────────────────────────────────────
function renderSoundBtn() {
  const btn = document.getElementById('btn-sound');
  const live = soundOn && POS.audioReady();
  btn.textContent = !soundOn ? '🔕 Sound off' : live ? '🔔 Sound on' : '🔔 Tap to enable sound';
  btn.className = `px-3 py-2 rounded-lg text-sm font-semibold ${!soundOn ? 'bg-gray-800 text-gray-400' : live ? 'bg-green-700 hover:bg-green-600' : 'bg-yellow-500 text-black animate-pulse'}`;
}
function toggleSound() {
  if (soundOn && !POS.audioReady()) {
    POS.unlockAudio();
    setTimeout(() => { POS.beep(1); renderSoundBtn(); }, 100);
    return;
  }
  soundOn = !soundOn;
  localStorage.setItem('kds.sound', soundOn ? 'on' : 'off');
  if (soundOn) { POS.unlockAudio(); setTimeout(() => POS.beep(1), 100); }
  renderSoundBtn();
}
document.addEventListener('pointerdown', () => setTimeout(renderSoundBtn, 150));

function toggleSize() {
  const lg = document.body.classList.toggle('kds-lg');
  localStorage.setItem('kds.size', lg ? 'lg' : 'md');
}
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => toast('Full screen not available', { type: 'warn' }));
}

init();
</script>
</body>
</html>
